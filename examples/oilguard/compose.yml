services:
  oilguard-setup:
    build: ../../examples/oilguard
    image: openegiz/oilguard:local
    restart: "no"
    command: ["python", "setup_twins.py"]
    environment:
      DITTO_URL: http://ditto-nginx:80
      DITTO_PASSWORD: ${DITTO_PASSWORD}
    depends_on:
      init:
        condition: service_completed_successfully

  oilguard-simulator:
    image: openegiz/oilguard:local
    pull_policy: never
    restart: unless-stopped
    mem_limit: 128m
    command: ["python", "oilguard_mqtt.py", "--mqtt-host", "mosquitto"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    depends_on:
      oilguard-setup:
        condition: service_completed_successfully


  grafana:
    volumes:
      - ../../examples/oilguard/dashboard.json:/var/lib/grafana/example-dashboards/oilguard.json:ro
